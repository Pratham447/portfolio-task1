<body>

<header class="site-header">
  <a class="brand" href="index.html" aria-label="Pratham, home">Pratham</a>
  <nav aria-label="Main navigation"><ul><li><a href="index.html">Home</a></li><li><a href="about.html">About</a></li><li><a href="projects.html">Projects</a></li><li><a href="contact.html" aria-current="page">Contact</a></li></ul></nav>

<main id="main">
<section aria-labelledby="h1"><h1 id="h1">Contact me</h1>
<p class="lead">Send a message and I'll reply as soon as I can.</p>
<form id="contact" novalidate aria-describedby="status">
  <fieldset><legend>Your message</legend>
    <label for="name">Name</label>
    <input id="name" name="name" type="text" autocomplete="name" required>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <label for="msg">Message</label>
    <textarea id="msg" name="msg" rows="5" required></textarea>
    <button class="btn" type="submit">Send message</button>
  </fieldset>
  <p id="status" role="status" aria-live="polite"></p>
</form></section>
</main>
<footer class="site-footer"><p>&copy; 2026 Pratham. Built during the Thiranex internship.</p></footer>
</body>
